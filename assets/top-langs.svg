<svg xmlns="http://www.w3.org/2000/svg" width="460" height="162" viewBox="0 0 460 162" role="img" aria-label="Most used languages">
  <style>
    .title { font: 600 15px -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; fill: #2F8FFF; }
    .name { font: 500 13px -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; fill: #F4F7FB; }
    .pct { font: 400 12px -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; fill: #A8B3C5; }
    .bar { transform-origin: 22px 0; animation: grow .9s ease-out both; }
    .row { opacity: 0; animation: fade .4s ease-out both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <rect x="0.5" y="0.5" width="459" height="161" rx="12" fill="#131822" stroke="#FFFFFF29"/>
  <text x="22" y="36" class="title">Most Used Languages</text>
  <clipPath id="bar"><rect x="22" y="52" width="416" height="10" rx="5"/></clipPath>
  <g clip-path="url(#bar)"><g class="bar"><rect x="22.0" y="52" width="311.0" height="10" fill="#3FB950"/><rect x="333.0" y="52" width="48.6" height="10" fill="#8B9BB4"/><rect x="381.6" y="52" width="37.8" height="10" fill="#A8B9CC"/><rect x="419.4" y="52" width="6.0" height="10" fill="#E34C26"/><rect x="425.4" y="52" width="5.5" height="10" fill="#AACE60"/><rect x="430.8" y="52" width="3.2" height="10" fill="#F1E05A"/><rect x="434.1" y="52" width="3.9" height="10" fill="#30363D"/></g></g>
  <g class="row" style="animation-delay:0.4s">
    <circle cx="27" cy="86" r="5" fill="#3FB950"/>
    <text x="40" y="90" class="name">C#</text>
    <text x="216" y="90" class="pct" text-anchor="end">74.8%</text>
  </g>
  <g class="row" style="animation-delay:0.48000000000000004s">
    <circle cx="235" cy="86" r="5" fill="#8B9BB4"/>
    <text x="248" y="90" class="name">ShaderLab</text>
    <text x="424" y="90" class="pct" text-anchor="end">11.7%</text>
  </g>
  <g class="row" style="animation-delay:0.56s">
    <circle cx="27" cy="110" r="5" fill="#A8B9CC"/>
    <text x="40" y="114" class="name">C</text>
    <text x="216" y="114" class="pct" text-anchor="end">9.1%</text>
  </g>
  <g class="row" style="animation-delay:0.64s">
    <circle cx="235" cy="110" r="5" fill="#E34C26"/>
    <text x="248" y="114" class="name">HTML</text>
    <text x="424" y="114" class="pct" text-anchor="end">1.4%</text>
  </g>
  <g class="row" style="animation-delay:0.72s">
    <circle cx="27" cy="134" r="5" fill="#AACE60"/>
    <text x="40" y="138" class="name">HLSL</text>
    <text x="216" y="138" class="pct" text-anchor="end">1.3%</text>
  </g>
  <g class="row" style="animation-delay:0.8s">
    <circle cx="235" cy="134" r="5" fill="#F1E05A"/>
    <text x="248" y="138" class="name">JavaScript</text>
    <text x="424" y="138" class="pct" text-anchor="end">0.8%</text>
  </g>
</svg>
